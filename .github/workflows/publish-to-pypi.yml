name: Publish Python distribution to PyPI and TestPyPI

on:
  release:
    types: [released]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
    # Took the hash for v6.0.2 on 26 Mar 2026
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - name: Set up Python
      # Took the hash for v5.6.0 on 19 Nov 2026
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      # Took the hash for v4.6.2 on 19 Nov 2026
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: python-package-distributions
        path: dist/
  publish-to-pypi:
    name: >-
      Publish Python distribution to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    - publish-to-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ginput
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    # Took the commit for v8.0.1 on 26 Mar 2026
    - name: Download all the dists
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
  publish-to-testpypi:
    name: Publish Python distribution to TestPyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/ginput

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    # Took the commit for v8.0.1 on 26 Mar 2026
    - name: Download all the dists
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to TestPyPI
      # Pinned commit for v1.13.0 on 26 Mar 2026
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
      with:
        repository-url: https://test.pypi.org/legacy/
